<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>櫃體置物管理</title>
<style>
:root{--pri:#2563eb;--pri-d:#1d4ed8;--pri-l:#dbeafe;--acc:#f59e0b;--acc-l:#fef3c7;--danger:#dc2626;--danger-l:#fee2e2;--bg:#f3f4f6;--card:#fff;--txt:#111827;--sub:#6b7280;--line:#e5e7eb;--r:14px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--txt);min-height:44px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
h2,h3{margin:0}
#topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:calc(var(--safe-t) + 6px) 8px 6px}
#topbar .ttl{flex:1;min-width:0;padding:0 6px}
#topbar .t1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .t2{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;min-width:44px;height:44px;border-radius:12px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active{background:var(--bg)}
.badge{position:absolute;top:4px;right:2px;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;line-height:1;padding:3px 5px;font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
main.has-bar{padding-bottom:calc(110px + var(--safe-b))}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:#fff;border:1px solid #d1d5db;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.warn{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.searchbar{width:100%;text-align:left;background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:13px 14px;color:var(--sub);margin-bottom:14px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:99px;background:#fff;border:1px solid #d1d5db;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.add{border-style:dashed;color:var(--pri)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.row h2{font-size:17px}
.grid{display:grid;gap:12px}
.grid.areas{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px}
.card.tap{cursor:pointer}
.card.tap:active{background:#f9fafb}
.card.add{border:2px dashed #cbd5e1;background:transparent;box-shadow:none;color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:92px;text-align:center}
.card .nm{font-size:17px;font-weight:700;padding-right:40px;word-break:break-all}
.card .sm{font-size:13px;color:var(--sub);margin-top:2px}
.dots{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:12px;font-size:20px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.dots:active{background:var(--bg)}
.warn-pill{display:inline-block;background:var(--acc-l);color:#92400e;border-radius:99px;font-size:12px;padding:2px 8px;margin-top:6px;font-weight:600}
.red-pill{background:var(--danger-l);color:#991b1b}
.cabrow{display:flex;gap:12px;align-items:center}
.mini{flex:none;width:64px;display:grid;gap:2px}
.mini i{background:#e5e7eb;border-radius:2px;display:block}
.mini i.f{background:#60a5fa}
.faces{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.face{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 12px;border-radius:10px;background:var(--bg);width:100%;text-align:left}
.face:active{background:#e5e7eb}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.legend{font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #cbd5e1}
.gridwrap{overflow-x:auto;padding-bottom:4px}
.cells{display:grid;gap:6px;grid-auto-rows:minmax(84px,auto)}
.cell{position:relative;text-align:left;background:#fff;border:2px dashed #cbd5e1;border-radius:12px;padding:20px 8px 8px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.cell .lbl{position:absolute;top:3px;left:7px;font-size:11px;font-weight:700;color:#94a3b8}
.cell .txt{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;word-break:break-all}
.cell .txt em{color:#cbd5e1;font-style:normal}
.cell .cnt{position:absolute;top:3px;right:6px;background:var(--pri);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.cell.has{border:2px solid #93c5fd;background:#eff6ff}
.cell.soon{border-style:solid;border-color:var(--acc);background:var(--acc-l)}
.cell.expired{border-style:solid;border-color:var(--danger);background:var(--danger-l)}
.cell.sel{outline:4px solid var(--pri);outline-offset:-2px;background:var(--pri-l)}
.cell.hl{animation:pulse 1s ease-in-out 6;box-shadow:0 0 0 4px var(--pri)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(37,99,235,.25)}}
.editnote{background:var(--pri-l);color:#1e3a8a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.orph{background:var(--acc-l);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar .in{max-width:860px;margin:0 auto}
.bar .info{font-size:13px;color:var(--sub);margin-bottom:8px}
.bar .btns{display:flex;gap:8px;flex-wrap:wrap}
.bar .btns .btn{flex:1 1 auto;min-width:70px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal .panel{position:relative;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.modal.center{align-items:center;padding:16px}
.modal.center .panel{border-radius:18px;max-height:85vh}
.modal.full .panel{max-height:100vh;height:100%;border-radius:0;max-width:760px}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal .panel{border-radius:18px}.modal.full .panel{height:auto;max-height:92vh;border-radius:18px}}
.panel h3{font-size:18px;margin-bottom:6px}
.panel .msg{color:#374151;margin:8px 0 4px}
.panel .btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.panel .btns .btn{flex:1 1 120px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.x{width:44px;height:44px;border-radius:12px;font-size:20px;color:var(--sub)}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu .btn{justify-content:flex-start;width:100%}
.menu .btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-weight:600;font-size:14px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.faceBox{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px}
.faceBox .ft{font-weight:700;margin-bottom:6px}
.dimrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dimrow small{display:block;color:var(--sub);font-size:12px;margin-bottom:3px}
.stepper{display:flex;gap:4px}
.stepper button{flex:none;width:44px;min-height:44px;border-radius:10px;background:#fff;border:1px solid #d1d5db;font-size:20px;font-weight:700}
.stepper input{text-align:center;padding:0 4px}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.sortbar{display:flex;gap:8px;margin:6px 0 10px}
.sortbar select{flex:1}
.item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.item .thumb{flex:none;width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;background:#e5e7eb}
.item .info{flex:1;min-width:0}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .l1 b{font-size:17px;word-break:break-all}
.item .qty{color:var(--pri);font-weight:700;flex:none}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub);margin-top:3px}
.item .acts{display:flex;gap:8px;margin-top:8px}
.tag{border-radius:99px;padding:0 8px;font-weight:700;font-size:12px}
.tag.soon{background:var(--acc-l);color:#92400e}
.tag.expired{background:var(--danger-l);color:#991b1b}
.res{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.res:active{background:var(--bg)}
.res .p{font-size:13px;color:var(--sub);word-break:break-all}
.res b{font-size:16px}
.photoPrev{margin-top:8px;display:flex;gap:10px;align-items:center}
.photoPrev img{width:72px;height:72px;object-fit:cover;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.95}
.imgfull{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
.ver{text-align:center;color:#9ca3af;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div id="topbar"></div>
<main id="view"><div class="empty">載入中…</div></main>
<div id="overlay-root"></div>
<div id="toast"></div>
<noscript>請開啟瀏覽器的 JavaScript 功能。</noscript>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import { getDatabase, ref, set, remove, get, onValue } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';

/* ========== Firebase（沿用原本的專案與資料路徑 /cabinetData，資料格式完全不變） ========== */
const firebaseConfig = {
  apiKey: "AIzaSyDxJCKSvrB3a6tYtzV9Q90p68odxaqQcXw",
  authDomain: "cabinet-sync-db.firebaseapp.com",
  databaseURL: "https://cabinet-sync-db-default-rtdb.firebaseio.com",
  projectId: "cabinet-sync-db",
  storageBucket: "cabinet-sync-db.firebasestorage.app",
  messagingSenderId: "209194186803",
  appId: "1:209194186803:web:6498fd5c812ea419e5cb46"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ROOT = 'cabinetData';

/* ========== 常數與小工具 ========== */
const MAXD = 20;
const TYPE_NAME = { straight: '一字形', L: 'L 型', U: 'U 型', square: '口 型' };
const FACES = { straight: [], L: ['短', '長'], U: ['面1', '面2', '面3'], square: ['面1', '面2', '面3', '面4'] };
const FACE_ORDER = ['短', '長', '面1', '面2', '面3', '面4'];
const FACE_DISP = { '短': '短邊', '長': '長邊' };
const SORT_FIELDS = [['', '預設順序'], ['name', '物品名稱'], ['quantity', '數量'], ['entryDate', '存入日期'], ['expiryDate', '有效日期'], ['purchasePlace', '購買地']];
const defaultLocations = [
  { name: '家裡', areas: ['客廳', '廚房', '玄關', '浴室', '樓下房間', '書房', '樓上小孩房', '主臥室'] },
  { name: '辦公室', areas: [] }
];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clean = v => JSON.parse(JSON.stringify(v));
const colLetter = c => { let s = '', n = c; do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0); return s; };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function daysLeft(s) {
  const d = parseDate(s); if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}
function expiryState(s) {
  const n = daysLeft(s);
  if (n === null) return null;
  if (n < 0) return 'expired';
  if (n <= 30) return 'soon';
  return null;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ========== 資料 ========== */
let data = null, ready = false;
const ui = { view: { name: 'home' }, locId: null, edit: false, sel: new Set(), highlight: null, undo: [], cell: null, cellModal: null, sortField: '', sortDir: 1 };

function toArr(v) {
  if (Array.isArray(v)) return v.filter(Boolean);
  if (v && typeof v === 'object') return Object.values(v).filter(Boolean);
  return [];
}
function normalize(d) {
  d = (d && typeof d === 'object') ? d : {};
  d.locations = d.locations || {};
  for (const [lid, loc] of Object.entries(d.locations)) {
    if (!loc.name) loc.name = lid;
    loc.areas = loc.areas || {};
    for (const [aid, area] of Object.entries(loc.areas)) {
      if (!area.name) area.name = aid;
      area.cabinets = area.cabinets || {};
      for (const [cid, cab] of Object.entries(area.cabinets)) {
        if (!cab.name) cab.name = cid;
        cab.type = cab.type || 'straight';
        cab.dimensions = cab.dimensions || {};
        cab.cells_data = cab.cells_data || {};
        for (const rec of Object.values(cab.cells_data)) {
          rec.items = toArr(rec.items);
          rec.merged = !!rec.merged;
          rec.span = rec.span || { row: 1, col: 1 };
        }
      }
    }
  }
  return d;
}
function defaultData() {
  const d = { locations: {} };
  for (const loc of defaultLocations) {
    const id = loc.name.toLowerCase().replace(/\s/g, '-');
    d.locations[id] = { name: loc.name, areas: {} };
    for (const an of loc.areas) {
      d.locations[id].areas[an.toLowerCase().replace(/\s/g, '-')] = { name: an, cabinets: {} };
    }
  }
  return d;
}

/* 只寫入「被修改的那一小塊」，不會整包覆蓋，也不會在讀取失敗時覆蓋資料 */
function nodeAt(path) { let n = data; for (const p of path) n = n == null ? undefined : n[p]; return n; }
async function saveAt(path) {
  if (!ready) { toast('尚未連上雲端，無法儲存'); return false; }
  const n = nodeAt(path);
  try {
    await set(ref(db, ROOT + '/' + path.join('/')), n === undefined ? null : clean(n));
    return true;
  } catch (e) { console.error(e); toast('儲存失敗，請檢查網路後再試'); return false; }
}
async function delAt(path) {
  if (!ready) { toast('尚未連上雲端，無法刪除'); return false; }
  const parent = nodeAt(path.slice(0, -1));
  if (parent) delete parent[path[path.length - 1]];
  try { await remove(ref(db, ROOT + '/' + path.join('/'))); return true; }
  catch (e) { console.error(e); toast('刪除失敗，請檢查網路後再試'); return false; }
}

/* 目前位置 */
const curLoc = () => data?.locations?.[ui.view.locId];
const curArea = () => curLoc()?.areas?.[ui.view.areaId];
const curCab = () => curArea()?.cabinets?.[ui.view.cabId];
const cabPath = (cid = ui.view.cabId) => ['locations', ui.view.locId, 'areas', ui.view.areaId, 'cabinets', cid];
const cellPath = id => [...cabPath(), 'cells_data', id];

function walk(fn) {
  for (const [lid, loc] of Object.entries(data.locations))
    for (const [aid, area] of Object.entries(loc.areas))
      for (const [cid, cab] of Object.entries(area.cabinets)) fn(lid, loc, aid, area, cid, cab);
}
const countItems = cab => Object.values(cab.cells_data).reduce((n, r) => n + r.items.length, 0);
const countArea = area => Object.values(area.cabinets).reduce((n, c) => n + countItems(c), 0);
function expCountOf(cab) {
  let soon = 0, exp = 0;
  for (const r of Object.values(cab.cells_data)) for (const it of r.items) {
    const s = expiryState(it.expiryDate); if (s === 'soon') soon++; else if (s === 'expired') exp++;
  }
  return { soon, exp };
}

/* ========== 格子版面（含合併） ========== */
function getSize(cab) {
  const m = /^(\d+)\s*x\s*(\d+)$/i.exec(String(cab.dimensions?.size || '3x3'));
  let rows = m ? +m[1] : 3, cols = m ? +m[2] : 3;
  rows = Math.max(1, Math.min(rows, 60)); cols = Math.max(1, Math.min(cols, 60));
  return { rows, cols };
}
function setSize(cab, rows, cols) { cab.dimensions = { ...(cab.dimensions || {}), size: `${rows}x${cols}` }; }
function parseId(id) { const m = /^(\d+)-(\d+)$/.exec(id); return m ? [+m[1], +m[2]] : null; }

function buildLayout(cab) {
  const { rows, cols } = getSize(cab);
  const cells = cab.cells_data;
  const byPos = Array.from({ length: rows }, () => Array(cols).fill(null));
  const anchors = [];
  const keys = Object.keys(cells).map(k => ({ k, p: parseId(k) })).filter(x => x.p)
    .sort((a, b) => a.p[0] - b.p[0] || a.p[1] - b.p[1]);
  for (const { k, p } of keys) {
    const rec = cells[k];
    if (!rec || !rec.merged) continue;
    const [r, c] = p; if (r >= rows || c >= cols) continue;
    const sp = rec.span || {};
    const rs = Math.max(1, Math.min(+sp.row || 1, rows - r));
    const cs = Math.max(1, Math.min(+sp.col || 1, cols - c));
    if (rs === 1 && cs === 1) continue;
    let free = true;
    for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) if (byPos[r + i][c + j]) free = false;
    if (!free) continue;
    const a = { id: k, r, c, rs, cs };
    for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) byPos[r + i][c + j] = a;
    anchors.push(a);
  }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!byPos[r][c]) { const a = { id: `${r}-${c}`, r, c, rs: 1, cs: 1 }; byPos[r][c] = a; anchors.push(a); }
  }
  const ids = new Set(anchors.map(a => a.id));
  const orphans = Object.keys(cells).filter(k => !ids.has(k) && cells[k] && cells[k].items && cells[k].items.length);
  return { rows, cols, byPos, anchors, orphans };
}
const anchorLabel = a => {
  const s = `${colLetter(a.c)}${a.r + 1}`;
  return (a.rs > 1 || a.cs > 1) ? `${s}–${colLetter(a.c + a.cs - 1)}${a.r + a.rs}` : s;
};
function locate(L, cellId) {
  const p = parseId(cellId); if (!p) return null;
  if (p[0] >= L.rows || p[1] >= L.cols) return null;
  return L.byPos[p[0]][p[1]];
}
function mkCell(old, a) {
  const items = old ? old.items : [];
  return { items, merged: a.rs > 1 || a.cs > 1, span: { row: a.rs, col: a.cs }, text: items.map(i => i.name).join(', ') };
}
function ensureCell(cab, L, id) {
  const a = L.anchors.find(x => x.id === id);
  let rec = cab.cells_data[id];
  if (!rec) rec = cab.cells_data[id] = { items: [], merged: false, span: { row: 1, col: 1 }, text: '' };
  if (a) { rec.merged = a.rs > 1 || a.cs > 1; rec.span = { row: a.rs, col: a.cs }; }
  return rec;
}
function syncText(rec) { rec.text = rec.items.map(i => i.name).join(', '); }

/* 插入／刪除 一列或一欄（會自動調整合併格，物品會移到相鄰格子，不會消失） */
function structuralOp(cab, axis, k, insert) {
  const L = buildLayout(cab);
  const P = axis, S = axis === 'r' ? 'rs' : 'cs';
  const cells = cab.cells_data, out = {}, naMap = {}, pending = [];
  for (const a of L.anchors) {
    const old = cells[a.id]; const na = { ...a };
    if (insert) {
      if (a[P] >= k) na[P]++; else if (a[P] + a[S] > k) na[S]++;
    } else {
      const covers = a[P] <= k && k < a[P] + a[S];
      if (covers) {
        if (a[S] > 1) na[S]--;
        else {
          const alt = k > 0 ? k - 1 : k + 1;
          const tr = axis === 'r' ? alt : a.r, tc = axis === 'r' ? a.c : alt;
          pending.push({ old, target: L.byPos[tr] && L.byPos[tr][tc] });
          continue;
        }
      } else if (a[P] > k) na[P]--;
    }
    naMap[a.id] = na;
    const rec = mkCell(old, na);
    if (!rec.items.length && !rec.merged) continue;
    out[`${na.r}-${na.c}`] = rec;
  }
  for (const p of pending) {
    if (!p.old || !p.old.items.length || !p.target) continue;
    const na = naMap[p.target.id]; if (!na) continue;
    const key = `${na.r}-${na.c}`;
    if (!out[key]) out[key] = mkCell(null, na);
    out[key].items = [...out[key].items, ...p.old.items];
    syncText(out[key]);
  }
  cab.cells_data = out;
  const s = getSize(cab), d = insert ? 1 : -1;
  setSize(cab, s.rows + (axis === 'r' ? d : 0), s.cols + (axis === 'c' ? d : 0));
}
function resizeCab(cab, rows, cols) {
  while (getSize(cab).rows > rows) structuralOp(cab, 'r', getSize(cab).rows - 1, false);
  while (getSize(cab).cols > cols) structuralOp(cab, 'c', getSize(cab).cols - 1, false);
  const s = getSize(cab);
  if (rows > s.rows || cols > s.cols) setSize(cab, Math.max(rows, s.rows), Math.max(cols, s.cols));
}

/* 櫃體群組（L／U／口型是由好幾「面」組成） */
function groupOf(cab) {
  if (cab.type === 'straight') return null;
  if (cab.group) return { group: cab.group, face: cab.face || String(cab.name).replace(cab.group, '').trim() || cab.name };
  const m = /^(.*) (短|長|面[1-4])$/.exec(String(cab.name));
  return m ? { group: m[1], face: m[2] } : null;
}
function groupCabs(area) {
  const list = [], map = new Map();
  for (const [id, cab] of Object.entries(area.cabinets)) {
    const g = groupOf(cab);
    if (!g) { list.push({ single: true, id, cab }); continue; }
    const key = cab.type + '|' + g.group;
    if (!map.has(key)) { const o = { single: false, group: g.group, type: cab.type, faces: [] }; map.set(key, o); list.push(o); }
    map.get(key).faces.push({ id, cab, face: g.face });
  }
  for (const g of list) if (!g.single) g.faces.sort((a, b) => FACE_ORDER.indexOf(a.face) - FACE_ORDER.indexOf(b.face));
  return list;
}
function siblingsOf(area, cabId) {
  const g = groupOf(area.cabinets[cabId]); if (!g) return [];
  const type = area.cabinets[cabId].type;
  return groupCabs(area).find(x => !x.single && x.type === type && x.group === g.group)?.faces || [];
}

/* ========== 畫面骨架 ========== */
const viewEl = $('#view'), root = $('#overlay-root');

function allItems() {
  const out = [];
  walk((lid, loc, aid, area, cid, cab) => {
    for (const [cell, rec] of Object.entries(cab.cells_data))
      rec.items.forEach((item, idx) => out.push({ lid, aid, cid, cell, idx, item, loc, area, cab }));
  });
  return out;
}
function reminderList() {
  return allItems().filter(x => expiryState(x.item.expiryDate)).sort((a, b) => daysLeft(a.item.expiryDate) - daysLeft(b.item.expiryDate));
}

let histIdx = 0;
function go(v, opts = {}) {
  ui.view = v; ui.edit = false; ui.sel.clear(); ui.undo = []; ui.highlight = v.hl || null;
  if (v.locId) { ui.locId = v.locId; lsSet('cab_lastLoc', v.locId); }
  if (opts.replace) history.replaceState({ v, i: histIdx }, '');
  else { histIdx++; history.pushState({ v, i: histIdx }, ''); }
  closeAllModals(); render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  const s = e.state;
  if (s && s.v) { histIdx = s.i; ui.view = s.v; } else { ui.view = { name: 'home' }; histIdx = 0; }
  ui.edit = false; ui.sel.clear(); ui.undo = []; ui.highlight = ui.view.hl || null;
  closeAllModals(); render();
});
function goBack() {
  if (histIdx > 0) { history.back(); return; }
  const v = ui.view;
  if (v.name === 'cabinet') go({ name: 'area', locId: v.locId, areaId: v.areaId }, { replace: true });
  else go({ name: 'home' }, { replace: true });
}

function render() {
  if (!ready) return;
  const v = ui.view;
  if (v.name === 'area' && !curArea()) { ui.view = { name: 'home' }; }
  if (v.name === 'cabinet' && !curCab()) { ui.view = curArea() ? { name: 'area', locId: v.locId, areaId: v.areaId } : { name: 'home' }; }
  renderTopbar();
  const n = ui.view.name;
  viewEl.className = (n === 'cabinet' && ui.edit) ? 'has-bar' : '';
  if (n === 'home') viewEl.innerHTML = viewHome();
  else if (n === 'area') viewEl.innerHTML = viewArea();
  else viewEl.innerHTML = viewCabinet();
  renderEditBar();
  if (n === 'cabinet') { const h = $('.cell.hl'); if (h) h.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function renderTopbar() {
  const v = ui.view; let title = '櫃體置物管理', sub = '';
  if (v.name === 'area') { title = curArea().name; sub = curLoc().name; }
  if (v.name === 'cabinet') { title = curCab().name; sub = `${curLoc().name} › ${curArea().name}`; }
  const n = reminderList().length;
  $('#topbar').innerHTML = `${v.name !== 'home' ? '<button class="ibtn" data-act="back" aria-label="返回">‹</button>' : ''}
    <div class="ttl"><div class="t1">${esc(title)}</div>${sub ? `<div class="t2">${esc(sub)}</div>` : ''}</div>
    <button class="ibtn" data-act="search" aria-label="搜尋">🔍</button>
    <button class="ibtn" data-act="bell" aria-label="到期提醒">🔔${n ? `<span class="badge">${n}</span>` : ''}</button>
    <button class="ibtn" data-act="more" aria-label="更多">⋯</button>`;
}

/* ---- 首頁：地點 + 區域 ---- */
function viewHome() {
  const locs = Object.entries(data.locations);
  if (!locs.length) return `<div class="empty">還沒有任何地點<br><br><button class="btn primary" data-act="addLoc">＋ 新增地點</button></div>`;

    const last = lsGet('cab_lastLoc');

  }

}

/* ---- 區域：櫃體清單 ---- */
function miniPreview(cab) {
  const L = buildLayout(cab);
  return `<div class="mini" style="grid-template-columns:repeat(${L.cols},1fr);aspect-ratio:${L.cols}/${L.rows}">${L.anchors.map(a => {
    const rec = cab.cells_data[a.id]; const f = rec && rec.items.length;
    return `<i class="${f ? 'f' : ''}" style="grid-row:${a.r + 1}/span ${a.rs};grid-column:${a.c + 1}/span ${a.cs}"></i>`;
  }).join('')}</div>`;
}
function viewArea() {
  const area = curArea();
  const groups = groupCabs(area);
  return `
    <div class="row"><h2>櫃體</h2></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
    ${groups.map(g => {
      if (g.single) {
        const c = g.cab, s = getSize(c), e = expCountOf(c);
        return `<div class="card tap" data-act="openCab" data-id="${esc(g.id)}">
          <div class="cabrow">${miniPreview(c)}<div style="min-width:0"><div class="nm">${esc(c.name)}</div>
          <div class="sm">${TYPE_NAME[c.type] || c.type} · ${s.rows} 列 × ${s.cols} 欄 · ${countItems(c)} 件物品</div>
          ${e.exp ? `<span class="warn-pill red-pill">已過期 ${e.exp}</span> ` : ''}${e.soon ? `<span class="warn-pill">快到期 ${e.soon}</span>` : ''}</div></div>
          <button class="dots" data-act="cabMenu" data-id="${esc(g.id)}" aria-label="管理櫃體">⋯</button></div>`;
      }
      return `<div class="card"><div class="nm">${esc(g.group)}</div><div class="sm">${TYPE_NAME[g.type] || g.type} · 共 ${g.faces.length} 面</div>
        <div class="faces">${g.faces.map(f => {
          const s = getSize(f.cab), e = expCountOf(f.cab);
          return `<button class="face" data-act="openCab" data-id="${esc(f.id)}"><span><b>${esc(FACE_DISP[f.face] || f.face)}</b> <span class="sm">${s.rows}×${s.cols} · ${countItems(f.cab)} 件</span></span><span>${e.exp ? '🔴' : e.soon ? '🟠' : ''} ›</span></button>`;
        }).join('')}</div>
        <button class="dots" data-act="groupMenu" data-group="${esc(g.group)}" data-type="${esc(g.type)}" aria-label="管理櫃體">⋯</button></div>`;
    }).join('')}
    <button class="card add" data-act="addCab">＋ 新增櫃體</button>
    </div>`;
}

/* ---- 櫃體：格子 ---- */
function viewCabinet() {
  const cab = curCab(), area = curArea(), L = buildLayout(cab);
  const sibs = siblingsOf(area, ui.view.cabId);
  const tabs = sibs.length > 1 ? `<div class="tabs">${sibs.map(f => `<button class="chip ${f.id === ui.view.cabId ? 'on' : ''}" data-act="openCab" data-id="${esc(f.id)}" data-replace="1">${esc(FACE_DISP[f.face] || f.face)}</button>`).join('')}</div>` : '';
  const orph = L.orphans.length ? `<div class="orph"><span>⚠ 有 ${L.orphans.reduce((n, k) => n + cab.cells_data[k].items.length, 0)} 件物品沒有顯示在格子裡（可能是舊版合併造成）</span><button class="btn warn sm" data-act="orphans">找回</button></div>` : '';
  const note = ui.edit ? `<div class="editnote">編輯格子模式：點選格子（可選多格）→ 按下方「合併」。也可以在選好一格後新增／刪除列欄。</div>` : '';
  return `${tabs}
    <div class="row"><div class="legend"><span><b style="background:#eff6ff;border-color:#93c5fd"></b>有物品</span><span><b style="background:var(--acc-l);border-color:var(--acc)"></b>30 天內到期</span><span><b style="background:var(--danger-l);border-color:var(--danger)"></b>已過期</span></div></div>
    ${orph}${note}
    <div class="gridwrap"><div class="cells" style="grid-template-columns:repeat(${L.cols},minmax(78px,1fr))">
    ${L.anchors.map(a => {
      const rec = cab.cells_data[a.id]; const items = rec ? rec.items : [];
      let st = items.length ? 'has' : '';
      if (items.some(i => expiryState(i.expiryDate) === 'expired')) st = 'expired';
      else if (items.some(i => expiryState(i.expiryDate) === 'soon')) st = 'soon';
      const cls = ['cell', st, ui.sel.has(a.id) ? 'sel' : '', ui.highlight === a.id ? 'hl' : ''].filter(Boolean).join(' ');
      return `<button class="${cls}" data-act="cell" data-id="${a.id}" style="grid-row:${a.r + 1}/span ${a.rs};grid-column:${a.c + 1}/span ${a.cs}">
        <span class="lbl">${anchorLabel(a)}</span>${items.length > 1 ? `<span class="cnt">${items.length}</span>` : ''}
        <span class="txt">${items.length ? esc(items.map(i => i.name).join('、')) : '<em>空</em>'}</span></button>`;
    }).join('')}
    </div></div>
    <div class="row" style="margin-top:16px;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="toggleEdit">${ui.edit ? '✔ 完成編輯' : '✎ 編輯格子（合併／增減列欄）'}</button>
      <button class="btn" data-act="editCab">⚙ 修改名稱／格數</button>
    </div>`;
}
function renderEditBar() {
  let bar = $('#editbar');
  if (!(ui.view.name === 'cabinet' && ui.edit)) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'editbar'; bar.className = 'bar'; document.body.appendChild(bar); }
  const hasUndo = ui.undo.length > 0;
  bar.innerHTML = `<div class="in"><div class="info">已選 ${ui.sel.size} 格 ${ui.sel.size ? '' : '· 請點選上方格子'}</div>
    <div class="btns"><button class="btn primary" data-act="merge">合併</button><button class="btn" data-act="split">拆分</button>
    <button class="btn" data-act="lineMenu">增減列欄</button><button class="btn" data-act="undo" ${hasUndo ? '' : 'disabled'}>↶ 復原</button>
    <button class="btn warn" data-act="toggleEdit">完成</button></div></div>`;
}

/* ========== 彈出視窗工具 ========== */
function openModal(html, { cls = '', onClose } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'modal' + (cls ? ' ' + cls : '');
  wrap.innerHTML = `<div class="backdrop"></div><div class="panel">${html}</div>`;
  root.appendChild(wrap); document.body.classList.add('noscroll');
  const m = {
    el: wrap, panel: wrap.querySelector('.panel'),
    close() { if (!wrap.isConnected) return; wrap.remove(); if (!root.children.length) document.body.classList.remove('noscroll'); onClose && onClose(); }
  };
  wrap._m = m;
  wrap.querySelector('.backdrop').addEventListener('click', () => m.close());
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) m.close(); });
  return m;
}
function closeAllModals() { [...root.children].forEach(c => c._m && c._m.close()); }

function confirmBox(msg, { ok = '確定', danger = false, title = '請確認' } = {}) {
  return new Promise(res => {
    const m = openModal(`<h3>${esc(title)}</h3><p class="msg">${esc(msg).replace(/\n/g, '<br>')}</p>
      <div class="btns"><button class="btn" data-close>取消</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button></div>`, { cls: 'center', onClose: () => res(false) });
    m.panel.querySelector('[data-yes]').addEventListener('click', () => { res(true); m.close(); });
  });
}
function askText({ title, label = '名稱', value = '', ok = '儲存', hint = '' }) {
  return new Promise(res => {
    const m = openModal(`<h3>${esc(title)}</h3><label>${esc(label)}</label><input id="atIn" type="text" value="${esc(value)}" maxlength="40" autocomplete="off">
      ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      <div class="btns"><button class="btn" data-close>取消</button><button class="btn primary" data-yes>${esc(ok)}</button></div>`, { cls: 'center', onClose: () => res(null) });
    const inp = m.panel.querySelector('#atIn');
    const submit = () => { const v = inp.value.trim(); if (!v) { toast('請輸入名稱'); return; } res(v); m.close(); };
    m.panel.querySelector('[data-yes]').addEventListener('click', submit);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
    setTimeout(() => { inp.focus(); inp.select(); }, 50);
  });
}
function menuSheet(title, entries) {
  const m = openModal(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="關閉">✕</button></div>
    <div class="menu">${entries.map((e, i) => `<button class="btn ${e.danger ? 'danger' : ''}" data-i="${i}">${esc(e.label)}</button>`).join('')}</div>`);
  m.panel.addEventListener('click', ev => {
    const b = ev.target.closest('[data-i]'); if (!b) return;
    const e = entries[+b.dataset.i]; m.close(); e.fn();
  });
  return m;
}

/* ========== 地點／區域 管理 ========== */
async function addLoc() {

function areaMenu(id) {

    { label: '✎ 重新命名', fn: async () => { const n = await askText({ title: '重新命名區域', value: area.name }); if (!n) return; area.name = n; await saveAt(['locations', ui.locId, 'areas', id, 'name']); render(); } },

}

/* ========== 櫃體 新增／修改／刪除 ========== */
function stepperHtml(face, dim, val) {
  return `<div class="stepper" data-face="${face}" data-dim="${dim}"><button type="button" data-step="-1" aria-label="減少">−</button><input type="number" inputmode="numeric" min="1" max="${MAXD}" value="${val}"><button type="button" data-step="1" aria-label="增加">＋</button></div>`;
}
function bindSteppers(panel, onChange) {
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-step]'); if (!b) return;
    const inp = b.parentElement.querySelector('input');
    inp.value = Math.max(1, Math.min(MAXD, (parseInt(inp.value) || 1) + (+b.dataset.step)));
    onChange && onChange();
  });

function pushUndo(cab) {
  ui.undo.push(JSON.stringify({ dimensions: cab.dimensions, cells_data: cab.cells_data }));
  if (ui.undo.length > 20) ui.undo.shift();
}
async function doUndo() {
  const cab = curCab(); if (!cab || !ui.undo.length) return;
  const snap = JSON.parse(ui.undo.pop());
  cab.dimensions = snap.dimensions; cab.cells_data = snap.cells_data;
  normalize(data); ui.sel.clear();
  await saveAt(cabPath()); render(); toast('已復原上一步');

function selectedAnchors(L) { return [...ui.sel].map(id => L.anchors.find(a => a.id === id)).filter(Boolean); }

async function mergeSel() {
  const cab = curCab(); if (!cab) return; const L = buildLayout(cab);
  const sel = selectedAnchors(L);
  if (sel.length < 2) { toast('請先點選 2 格以上要合併的格子'); return; }
  let r0 = Math.min(...sel.map(a => a.r)), r1 = Math.max(...sel.map(a => a.r + a.rs - 1));
  let c0 = Math.min(...sel.map(a => a.c)), c1 = Math.max(...sel.map(a => a.c + a.cs - 1));
  let changed = true;
  while (changed) {
    changed = false;
    for (const a of L.anchors) {
      const ar1 = a.r + a.rs - 1, ac1 = a.c + a.cs - 1;
      if (a.r <= r1 && ar1 >= r0 && a.c <= c1 && ac1 >= c0) {
        if (a.r < r0) { r0 = a.r; changed = true; } if (ar1 > r1) { r1 = ar1; changed = true; }
        if (a.c < c0) { c0 = a.c; changed = true; } if (ac1 > c1) { c1 = ac1; changed = true; }
      }
    }
  }
  const inside = L.anchors.filter(a => a.r >= r0 && a.r + a.rs - 1 <= r1 && a.c >= c0 && a.c + a.cs - 1 <= c1)
    .sort((a, b) => a.r - b.r || a.c - b.c);
  pushUndo(cab);
  let items = [];
  for (const a of inside) { const rec = cab.cells_data[a.id]; if (rec) items = items.concat(rec.items); delete cab.cells_data[a.id]; }
  const id = `${r0}-${c0}`;
  cab.cells_data[id] = { items, merged: true, span: { row: r1 - r0 + 1, col: c1 - c0 + 1 }, text: items.map(i => i.name).join(', ') };
  ui.sel.clear();
  await saveAt(cabPath()); render();
  toast(items.length ? `已合併，${items.length} 件物品都保留在合併後的格子` : '已合併');
}
async function splitSel() {
  const cab = curCab(); if (!cab) return; const L = buildLayout(cab);
  const sel = selectedAnchors(L).filter(a => a.rs > 1 || a.cs > 1);
  if (!sel.length) { toast('請先點選要拆分的「合併格」'); return; }
  pushUndo(cab);
  for (const a of sel) {
    const rec = cab.cells_data[a.id];
    cab.cells_data[a.id] = { items: rec ? rec.items : [], merged: false, span: { row: 1, col: 1 }, text: rec ? rec.text || '' : '' };

async function lineOp(kind, axis, k) {
  const cab = curCab(); if (!cab) return; const L = buildLayout(cab);
  if (L.orphans.length) { toast('有未顯示的物品，請先按黃色「找回」整理後再調整列欄'); return; }
  const total = axis === 'r' ? L.rows : L.cols;
  if (kind === 'ins') {
    if (total >= MAXD) { toast(`最多 ${MAXD} ${axis === 'r' ? '列' : '欄'}`); return; }
  } else {
    if (total <= 1) { toast('至少要保留 1 ' + (axis === 'r' ? '列' : '欄')); return; }
    const P = axis, S = axis === 'r' ? 'rs' : 'cs';
    const moving = L.anchors.filter(a => a[P] <= k && k < a[P] + a[S] && a[S] === 1).reduce((n, a) => n + ((cab.cells_data[a.id]?.items.length) || 0), 0);
    if (moving > 0) {
      const ok = await confirmBox(`這${axis === 'r' ? '一列' : '一欄'}有 ${moving} 件物品，刪除後會自動移到相鄰的格子。\n要繼續嗎？`, { ok: '繼續刪除', danger: true });
      if (!ok) return;
    }
  }
  pushUndo(cab);
  structuralOp(cab, axis, k, kind === 'ins');
  ui.sel.clear();
  await saveAt(cabPath()); render();
  toast(kind === 'ins' ? '已插入' : '已刪除（物品已保留）');
}

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    };
    const target = m.panel.querySelector('#ifCell').value;
    const cabNow = curCab(), Ln = buildLayout(cabNow);
    const src = cabNow.cells_data[cellId];
    if (editing && target === cellId) {
      src.items[idx] = item; syncText(ensureCell(cabNow, Ln, cellId));
      await saveAt(cellPath(cellId));
    } else {
      if (editing && src) { src.items.splice(idx, 1); syncText(src); }
      const dst = ensureCell(cabNow, Ln, target); dst.items.push(item); syncText(dst);
      if (editing && src && !src.items.length && !src.merged) delete cabNow.cells_data[cellId];
      await saveAt(cellPath(target));
      if (editing) await saveAt(cellPath(cellId));
    }
    m.close(); render(); renderCellSheet(); toast(editing ? '已更新' : '已新增');
    if (again) setTimeout(() => itemForm(), 80);
  }
  m.panel.querySelector('#ifOk').addEventListener('click', () => save(false));
  const more = m.panel.querySelector('#ifMore'); if (more) more.addEventListener('click', () => save(true));
  m.panel.querySelector('#ifName').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); save(false); } });
  if (!editing) setTimeout(() => m.panel.querySelector('#ifName').focus(), 60);
}
async function delItem(idx) {
  const cab = curCab(), rec = cab.cells_data[ui.cell]; const it = rec?.items[idx]; if (!it) return;
  const ok = await confirmBox(`確定刪除「${it.name}」？`, { ok: '刪除', danger: true }); if (!ok) return;
  rec.items.splice(idx, 1); syncText(rec);
  if (!rec.items.length && !rec.merged) { delete cab.cells_data[ui.cell]; await delAt(cellPath(ui.cell)); }
  else await saveAt(cellPath(ui.cell));
  render(); renderCellSheet(); toast('已刪除');
}

/* ========== 搜尋（按下「搜尋」或 Enter 才搜，不會邊打字邊搜） ========== */
function itemPath(x) { return `${x.loc.name} › ${x.area.name} › ${x.cab.name}`; }
function resultHtml(list) {
  if (!list.length) return '<div class="empty">沒有找到符合的物品</div>';
  return list.map(x => {
    const L = buildLayout(x.cab); const a = locate(L, x.cell);
    const dl = daysLeft(x.item.expiryDate);
    return `<button class="res" data-act="goItem" data-lid="${esc(x.lid)}" data-aid="${esc(x.aid)}" data-cid="${esc(x.cid)}" data-cell="${esc(x.cell)}">
      <b>${esc(x.item.name)}</b>${x.item.quantity ? ` × ${esc(x.item.quantity)}` : ''}
      <div class="p">${esc(itemPath(x))} › ${a ? anchorLabel(a) : '（需整理）'}</div>
      <div class="p">${x.item.entryDate ? '存入 ' + esc(x.item.entryDate) + '　' : ''}${x.item.expiryDate ? '有效 ' + esc(x.item.expiryDate) : ''} ${dl !== null ? expBadge(x.item.expiryDate) : ''}</div></button>`;
  }).join('');
}
function openSearch() {
  const m = openModal(`<div class="sheet-head"><h3>搜尋物品</h3><button class="x" data-close aria-label="關閉">✕</button></div>
    <label>物品名稱（打完整個詞，再按「搜尋」或 Enter）</label>
    <input id="sqName" type="search" enterkeyhint="search" placeholder="例如：西瓜" autocomplete="off">
    <div class="dimrow"><div><label>日期種類</label><select id="sqType"><option value="expiryDate">有效日期</option><option value="entryDate">存入日期</option></select></div>
    <div><label>指定日期（可不填）</label><input id="sqDate" type="date"></div></div>
    <div class="btns" style="margin-top:12px"><button class="btn" id="sqSoon">只看快到期</button><button class="btn primary" id="sqGo">🔍 搜尋</button></div>
    <div id="sqRes" style="margin-top:14px"></div>`, { cls: 'full' });
  const nameEl = m.panel.querySelector('#sqName'), resEl = m.panel.querySelector('#sqRes');
  function run() {
    const q = nameEl.value.trim().toLowerCase(), dt = m.panel.querySelector('#sqDate').value, type = m.panel.querySelector('#sqType').value;
    if (!q && !dt) { resEl.innerHTML = '<div class="empty">請輸入物品名稱或選擇日期</div>'; return; }
    const list = allItems().filter(x => (!q || String(x.item.name || '').toLowerCase().includes(q)) && (!dt || x.item[type] === dt));
    resEl.innerHTML = `<div class="hint" style="margin-bottom:8px">找到 ${list.length} 筆</div>` + resultHtml(list);
  }
  m.panel.querySelector('#sqGo').addEventListener('click', run);
  m.panel.querySelector('#sqSoon').addEventListener('click', () => {
    const list = reminderList();
    resEl.innerHTML = `<div class="hint" style="margin-bottom:8px">30 天內到期或已過期：${list.length} 筆</div>` + resultHtml(list);
  });
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); nameEl.blur(); run(); } });
  setTimeout(() => nameEl.focus(), 80);
}
function goItem(d) {
  const cab = data.locations[d.lid]?.areas[d.aid]?.cabinets[d.cid]; if (!cab) { toast('找不到這個櫃體'); return; }
  const L = buildLayout(cab); const a = locate(L, d.cell);
  go({ name: 'cabinet', locId: d.lid, areaId: d.aid, cabId: d.cid, hl: a ? a.id : null });
}

/* ========== 到期提醒 ========== */
function openReminders(manual) {
  const list = reminderList();
  if (!list.length) { if (manual) toast('目前沒有快到期的物品 👍'); return; }
  const m = openModal(`<div class="sheet-head"><h3>⏰ 到期提醒（${list.length}）</h3><button class="x" data-close aria-label="關閉">✕</button></div>
    <div class="hint" style="margin-bottom:10px">有效日期在 30 天內，或已過期。點一下會帶您到那個櫃體並標示格子。</div>${resultHtml(list)}
    <div class="btns"><button class="btn primary" data-close>我知道了</button></div>`);
  return m;
}

/* ========== 匯出／匯入 ========== */
async function exportData(silent) {
  let exp = data;
  try { const snap = await get(ref(db, ROOT)); if (snap.val()) exp = snap.val(); } catch (e) { }
  const blob = new Blob([JSON.stringify(exp, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `cabinetAppData_${todayStr().replace(/-/g, '')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  if (!silent) toast('已匯出備份檔');
}
function moreMenu() {
  menuSheet('更多', [
    { label: '💾 匯出備份（下載 JSON 檔）', fn: () => exportData() },
    { label: '📥 匯入備份（會取代目前所有資料）', fn: () => $('#importInput').click() },
    { label: '🔄 重新整理頁面', fn: () => location.reload() }
  ]);
}
const importInput = document.createElement('input');
importInput.type = 'file'; importInput.accept = '.json,application/json'; importInput.id = 'importInput'; importInput.style.display = 'none';
document.body.appendChild(importInput);
importInput.addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let obj;
  try { obj = JSON.parse(await f.text()); if (obj.cabinetData) obj = obj.cabinetData; if (!obj.locations || typeof obj.locations !== 'object') throw new Error('x'); }
  catch (err) { toast('這不是有效的備份檔'); return; }
  const ok = await confirmBox('匯入會「取代」目前雲端上的全部資料。\n系統會先自動下載一份目前資料的備份給您。\n要繼續嗎？', { ok: '先備份再匯入', danger: true });
  if (!ok) return;
  await exportData(true);
  try {
    obj = normalize(obj);
    await set(ref(db, ROOT), clean(obj)); toast('匯入完成');
  } catch (err) { toast('匯入失敗：' + err.message); }
});

/* ========== 點擊事件總管 ========== */
const actions = {
  back: () => goBack(),
  search: () => openSearch(),
  bell: () => openReminders(true),
  more: () => moreMenu(),
  selLoc: d => { ui.locId = d.id; lsSet('cab_lastLoc', d.id); render(); },
  addLoc, locMenu, addArea,
  areaMenu: d => areaMenu(d.id),
  openArea: d => go({ name: 'area', locId: ui.locId, areaId: d.id }),
  addCab: () => addCabForm(),
  openCab: (d) => go({ name: 'cabinet', locId: ui.view.locId, areaId: ui.view.areaId, cabId: d.id }, { replace: !!d.replace }),
  cabMenu: d => cabMenu(d.id),
  groupMenu: d => groupMenu(d.group, d.type),
  editCab: () => editCabForm(),
  toggleEdit: () => { ui.edit = !ui.edit; ui.sel.clear(); ui.undo = ui.edit ? ui.undo : []; render(); },
  cell: (d, el) => {
    if (ui.highlight) { ui.highlight = null; document.querySelectorAll('.cell.hl').forEach(x => x.classList.remove('hl')); }
    if (ui.edit) {
      if (ui.sel.has(d.id)) ui.sel.delete(d.id); else ui.sel.add(d.id);
      el.classList.toggle('sel', ui.sel.has(d.id)); renderEditBar();
    } else openCellSheet(d.id);
  },
  merge: () => mergeSel(), split: () => splitSel(), lineMenu: () => lineMenu(), undo: () => doUndo(),
  orphans: () => orphansForm(),
  itemAdd: () => itemForm(),
  itemEdit: d => itemForm(+d.idx),
  itemDel: d => delItem(+d.idx),
  img: d => {
    const it = curCab()?.cells_data[ui.cell]?.items[+d.idx]; if (!it || !it.image) return;
    const m = openModal(`<img class="imgfull" src="${esc(it.image)}" alt="物品照片"><div class="btns"><button class="btn primary" data-close>關閉</button></div>`, { cls: 'center' });
  },
  goItem: d => { goItem({ lid: d.lid, aid: d.aid, cid: d.cid, cell: d.cell }); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = actions[t.dataset.act]; if (fn) fn(t.dataset, t, e);
});

/* ========== 啟動：即時同步 ========== */
let firstShown = false, seeding = false;
function showLoadError(msg) {
  viewEl.innerHTML = `<div class="empty">${esc(msg)}<br><br><button class="btn primary" onclick="location.reload()">重新載入</button></div>`;
}
setTimeout(() => { if (!ready) showLoadError('連線比較慢…請確認網路，或稍後重新載入。（您的資料不會因此被更動）'); }, 12000);

onValue(ref(db, ROOT), snap => {
  const v = snap.val();
  if (v === null) {
    // 雲端真的完全沒有資料（全新專案）才建立預設資料
    if (seeding) return; seeding = true;
    data = normalize(defaultData()); ready = true;
    set(ref(db, ROOT), clean(data)).catch(err => console.error(err));
  } else {
    data = normalize(v); ready = true;
  }
  if (!firstShown) {
    firstShown = true;
    history.replaceState({ v: { name: 'home' }, i: 0 }, '');
    render(); openReminders(false);
  } else {
    render(); renderCellSheet();
  }
}, err => {
  console.error(err);
  if (!ready) showLoadError('無法連上雲端資料庫，請檢查網路後重新載入。（您的資料不會被更動）');
  else toast('與雲端的連線中斷，修改可能無法儲存');
});
</script>
